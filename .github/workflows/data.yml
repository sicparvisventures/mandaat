name: Nightly data
on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:
concurrency: data
jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Slow-changing sources are cached between runs: EP member details and body names (pipeline
      # refreshes them after 3 and 30 days) and the yearly FTS files (~300 MB, refreshed after 30 days).
      - uses: actions/cache@v4
        with:
          path: |
            data/raw/ep
            data/raw/fts
          key: raw-${{ github.run_id }}
          restore-keys: raw-
      - run: pnpm pipeline
      - run: pnpm pipeline:upload
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
